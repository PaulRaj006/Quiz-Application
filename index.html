<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlacementPro — Sign In / Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="CSS/index.css">
</head>
<body>

  <!-- ===================== BACKGROUND SCENE ===================== -->
  <div class="scene" aria-hidden="true">
    <div class="grid-overlay"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <svg class="scene-illustration" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#7C6CF7" stop-opacity="0.15"/>
        </linearGradient>
        <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0.85"/>
        </linearGradient>
      </defs>

      <!-- laptop / code editor silhouette -->
      <g class="float-slow" transform="translate(90,470)">
        <rect x="0" y="0" width="330" height="200" rx="14" fill="url(#panelGrad)" stroke="#A5B4FC" stroke-opacity="0.35"/>
        <rect x="20" y="20" width="290" height="140" rx="6" fill="#0B1020" fill-opacity="0.55"/>
        <rect x="34" y="36" width="90" height="8" rx="4" fill="#818CF8"/>
        <rect x="34" y="56" width="150" height="6" rx="3" fill="#6366F1" fill-opacity="0.7"/>
        <rect x="34" y="72" width="120" height="6" rx="3" fill="#4F46E5" fill-opacity="0.6"/>
        <rect x="34" y="88" width="170" height="6" rx="3" fill="#818CF8" fill-opacity="0.5"/>
        <rect x="34" y="104" width="90" height="6" rx="3" fill="#6366F1" fill-opacity="0.6"/>
        <rect x="-10" y="200" width="350" height="14" rx="7" fill="#312E81" fill-opacity="0.5"/>
      </g>

      <!-- interview / leaderboard bar chart -->
      <g class="float-med" transform="translate(830,430)">
        <rect x="0" y="120" width="34" height="90" rx="6" fill="url(#barGrad)"/>
        <rect x="50" y="70" width="34" height="140" rx="6" fill="url(#barGrad)"/>
        <rect x="100" y="30" width="34" height="180" rx="6" fill="url(#barGrad)"/>
        <rect x="150" y="90" width="34" height="120" rx="6" fill="url(#barGrad)"/>
        <circle cx="117" cy="10" r="14" fill="#EEF2FF" fill-opacity="0.85"/>
        <path d="M110 10 l5 5 l10 -10" stroke="#4F46E5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- graduation cap -->
      <g class="float-slow" transform="translate(1000,150)">
        <path d="M60 0 L120 24 L60 48 L0 24 Z" fill="#A5B4FC" fill-opacity="0.55"/>
        <path d="M30 32 V56 C30 68 90 68 90 56 V32" fill="none" stroke="#C7D2FE" stroke-width="3" stroke-opacity="0.6"/>
        <line x1="112" y1="26" x2="112" y2="60" stroke="#EEF2FF" stroke-width="2" stroke-opacity="0.6"/>
        <circle cx="112" cy="64" r="4" fill="#EEF2FF" fill-opacity="0.7"/>
      </g>

      <!-- circuit / network dotted connectors -->
      <g class="network-lines" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1.5" fill="none">
        <path d="M420 120 L560 60 L720 140 L900 90"/>
        <path d="M180 260 L360 320 L560 260"/>
        <path d="M240 620 L420 560 L640 610 L780 540"/>
      </g>
      <g fill="#A5B4FC" fill-opacity="0.5">
        <circle cx="420" cy="120" r="4"/>
        <circle cx="560" cy="60" r="4"/>
        <circle cx="720" cy="140" r="4"/>
        <circle cx="900" cy="90" r="4"/>
        <circle cx="180" cy="260" r="4"/>
        <circle cx="360" cy="320" r="4"/>
        <circle cx="560" cy="260" r="4"/>
        <circle cx="240" cy="620" r="4"/>
        <circle cx="420" cy="560" r="4"/>
        <circle cx="640" cy="610" r="4"/>
        <circle cx="780" cy="540" r="4"/>
      </g>

      <!-- code bracket motif -->
      <text class="code-glyph" x="60" y="140" font-family="JetBrains Mono, monospace" font-size="90" fill="#818CF8" fill-opacity="0.18">&lt;/&gt;</text>
      <text class="code-glyph glyph-2" x="1020" y="680" font-family="JetBrains Mono, monospace" font-size="70" fill="#A5B4FC" fill-opacity="0.16">{ }</text>
    </svg>

    <div class="floating-tags">
      <span class="tag t1">SQL</span>
      <span class="tag t2">Aptitude</span>
      <span class="tag t3">DSA</span>
      <span class="tag t4">Java Script</span>
      <span class="tag t5">HR&nbsp;Round</span>
    </div>

    <div class="terminal-strip">
      <span class="terminal-dot d1"></span><span class="terminal-dot d2"></span><span class="terminal-dot d3"></span>
      <span class="terminal-prompt">&gt;</span>
      <span class="terminal-text" id="terminalText"></span><span class="cursor">▌</span>
    </div>
  </div>

  <!-- ===================== AUTH CARD ===================== -->
  <main class="auth-wrapper">
    <div class="auth-card" id="authCard">

      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <h1 class="brand-name">Quiz Master</h1>
        <p class="brand-tag">Campus Placement Preparation</p>
      </div>

      <p class="form-message" id="formMessage" role="alert"></p>

      <!-- SIGN UP -->
      <section class="form-panel" id="signupPanel">
        <h2 class="form-title">Create your account</h2>
        <p class="form-subtitle">Start your journey towards placement success.</p>

        <form id="signupForm" novalidate autocomplete="off">
          <div class="field">
            <i class="fa-regular fa-user field-icon"></i>
            <input type="text" id="suUsername" placeholder=" " autocomplete="username">
            <label for="suUsername">Username</label>
            <span class="underline"></span>
            <span class="error-msg" id="suUsernameError"></span>
          </div>

          <div class="field">
            <i class="fa-regular fa-envelope field-icon"></i>
            <input type="email" id="suEmail" placeholder=" " autocomplete="email">
            <label for="suEmail">Email</label>
            <span class="underline"></span>
            <span class="error-msg" id="suEmailError"></span>
          </div>

          <div class="field">
            <i class="fa-solid fa-lock field-icon"></i>
            <input type="password" id="suPassword" placeholder=" " autocomplete="new-password">
            <label for="suPassword">Password</label>
            <span class="underline"></span>
            <button type="button" class="eye-toggle" data-target="suPassword" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
            <span class="error-msg" id="suPasswordError"></span>
          </div>

          <div class="field">
            <i class="fa-solid fa-lock field-icon"></i>
            <input type="password" id="suConfirm" placeholder=" " autocomplete="new-password">
            <label for="suConfirm">Confirm Password</label>
            <span class="underline"></span>
            <button type="button" class="eye-toggle" data-target="suConfirm" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
            <span class="error-msg" id="suConfirmError"></span>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="terms">
            <label for="terms">I agree to the <a href="#" class="link" onclick="return false;">terms &amp; conditions</a></label>
          </div>
          <span class="error-msg" id="termsError"></span>

          <button type="submit" class="btn-primary">
            <span>Create Account</span> <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p class="switch-text">Already have an account?
          <button type="button" class="link-btn" id="toSignIn">Sign In</button>
        </p>
      </section>

      <!-- SIGN IN -->
      <section class="form-panel" id="signinPanel" hidden>
        <h2 class="form-title">Welcome back</h2>
        <p class="form-subtitle">Continue your placement preparation journey.</p>

        <form id="signinForm" novalidate autocomplete="off">
          <div class="field">
            <i class="fa-regular fa-user field-icon"></i>
            <input type="text" id="siUsername" placeholder=" " autocomplete="username">
            <label for="siUsername">Username or Email</label>
            <span class="underline"></span>
            <span class="error-msg" id="siUsernameError"></span>
          </div>

          <div class="field">
            <i class="fa-solid fa-lock field-icon"></i>
            <input type="password" id="siPassword" placeholder=" " autocomplete="current-password">
            <label for="siPassword">Password</label>
            <span class="underline"></span>
            <button type="button" class="eye-toggle" data-target="siPassword" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
            <span class="error-msg" id="siPasswordError"></span>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me</label>
          </div>

          <button type="submit" class="btn-primary">
            <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p class="switch-text">Don't have an account?
          <button type="button" class="link-btn" id="toSignUp">Sign Up</button>
        </p>
      </section>

    </div>
  </main>

  <script src="JS/index.js"></script>
</body>
</html>
